<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wakework Agent</title><link rel="stylesheet" href="/style.css"></head><body><main class="agent-shell"><span class="eyebrow">LOCAL LAPTOP AGENT</span><h1>Monitoring console</h1><p class="muted">This prototype exposes the local connection and monitoring state. Camera, screen, and input adapters plug in here later.</p><div class="card agent-card"><div class="live-dot"></div><h2 id="status">Connecting...</h2><p id="target">Waiting for a phone session.</p><button id="working">Confirm working</button><button id="away" class="secondary">Mark uncertain</button></div><p><a href="/">Back to phone controller</a></p></main><script>
const ws=new WebSocket(`ws://${location.host}`),$=id=>document.getElementById(id); ws.onopen=()=>{ws.send(JSON.stringify({type:'laptop-online'}));$('status').textContent='Agent online locally';}; ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='state'){$('target').textContent=d.state.target?`Target: ${d.state.target}`:'Waiting for a phone session.';}}; $('working').onclick=()=>ws.send(JSON.stringify({type:'tick',working:true,checkIn:true}));$('away').onclick=()=>ws.send(JSON.stringify({type:'tick',working:false})); window.onbeforeunload=()=>ws.send(JSON.stringify({type:'laptop-offline'}));
</script></body></html>
