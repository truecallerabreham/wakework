<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wakework Agent</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="agent-shell">
  <span class="eyebrow">LOCAL LAPTOP AGENT</span>
  <h1>Monitoring console</h1>
  <p class="muted">Keep this tab open. It holds the local connection the phone depends on. Camera, screen, and input adapters plug in here later.</p>
  <div class="card agent-card">
    <div class="live-dot"></div>
    <h2 id="status">Connecting...</h2>
    <p id="target">Waiting for a phone session.</p>
    <p class="status" id="sessionLine"></p>
    <button id="working">Confirm working</button>
    <button id="away" class="secondary">Mark uncertain</button>
  </div>
  <p><a href="/">Back to phone controller</a></p>
</main>
<script>
const ws = new WebSocket(`ws://${location.host}`);
const $ = id => document.getElementById(id);
let online = true;

ws.onopen = () => {
  ws.send(JSON.stringify({ type: 'laptop-online' }));
  $('status').textContent = 'Agent online locally';
};
setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'laptop-online' })); }, 10000);
ws.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.type !== 'state') return;
  const s = d.state;
  $('target').textContent = s.target ? `Target: ${s.target}` : 'Waiting for a phone session.';
  const pieces = [s.state.replaceAll('-', ' ')];
  if (s.mode) pieces.push(s.mode);
  if (s.totalMinutes || s.validatedMinutes || s.phoneMinutes) pieces.push(`${s.totalMinutes}/30 min`);
  if (s.nextAlarmAt) pieces.push(`re-alarm at ${new Date(s.nextAlarmAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`);
  $('sessionLine').textContent = pieces.join(' · ');
};
$('working').onclick = () => ws.send(JSON.stringify({ type: 'tick', working: true, checkIn: true }));
$('away').onclick = () => ws.send(JSON.stringify({ type: 'tick', working: false }));
window.onbeforeunload = () => ws.send(JSON.stringify({ type: 'laptop-offline' }));
</script>
</body>
</html>
