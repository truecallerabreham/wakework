name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

concurrency:
  group: apk-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate native Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild -p android --no-install

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Wakework.apk

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wakework — latest build
          body: |
            Installable Android build of Wakework, built automatically from `main`.

            Install: download `Wakework.apk` on your phone, open it, and allow "install unknown apps" when prompted.
          make_latest: true
          allow_updates: true
          files: Wakework.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
